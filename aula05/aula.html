<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Escola Virtual</h1>
<h2>Formulário de Pré-Matrícula</h2>

<form action="" method="post">

  <fieldset>
    <legend><strong>Dados Pessoais</strong></legend>

    <div class="campo-grupo">
      <div class="campo">
        <label for="nome_aluno">Nome do Aluno</label>
        <input type="text" id="nome_aluno" name="nome_aluno" required>
      </div>
      <div class="campo">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email">
      </div>
    </div>

    <div class="campo-grupo">
      <div class="campo">
        <label for="nome_mae">Nome da Mãe</label>
        <input type="text" id="nome_mae" name="nome_mae">
      </div>
      <div class="campo">
        <label for="nome_pai">Nome do Pai</label>
        <input type="text" id="nome_pai" name="nome_pai">
      </div>
    </div>

    <div class="campo-grupo">
      <div class="campo">
        <label for="nascimento">Nascimento</label>
        <input type="date" id="nascimento" name="nascimento">
      </div>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" maxlength="15" placeholder="(61) 9 9999-9999">
      </div>
    </div>

    <div class="campo-grupo">
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" maxlength="11" placeholder="000.000.000-00">
      </div>
      <div class="campo">
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" maxlength="8" placeholder="00000-000">
      </div>
    </div>

    <div class="campo-grupo">
      <div class="campo">
        <label for="matricula">matricula</label>
        <input type="text" id="matricula" name="matricula" maxlength="11" placeholder="000.000.000-00">
      </div>
      <div class="campo">
        <label for="idade">idade</label>
        <input type="text" id="idade" name="idade" disabled>
      </div>
    </div>

    <div class="campo-grupo">
      <div class="campo">
        <label for="estado1">estado</label>
        <select id="estado1" name="estado1">
        </select>
      </div>

      <div class="campo">
        <label for="cidade1">cidade</label>
        <select id="cidade1" name="cidade1">
        </select>
      </div>
    </div>


  </fieldset>

  <fieldset>
    <legend><strong>Informações de Matrícula</strong></legend>

    <table>
      <tr valign="top">
        <td>
          <strong>Série</strong>
          <select id="serie" name="serie">
            <option value="pre-escolar">Pré-escolar</option>
            <option value="1ano">1º ano</option>
            <option value="2ano">2º ano</option>
            <option value="3ano">3º ano</option>
            <option value="4ano">4º ano</option>
            <option value="5ano">5º ano</option>
          </select>


            <div class="segunda-lingua">
                <strong>SEGUNDA LÍNGUA</strong>

                <div class="opcao-lingua">
                    <input type="radio" name="segunda_lingua" id="ingles" value="ingles">
                    <span class="codigo">US</span>
                    <label for="ingles">Inglês</label>
                </div>

                <div class="opcao-lingua">
                    <input type="radio" name="segunda_lingua" id="espanhol" value="espanhol">
                    <span class="codigo">ES</span>
                    <label for="espanhol">Espanhol</label>
                </div>
            </div>
        </td>

        <td>
          <strong>Turno</strong>
          <input type="radio" name="turno" id="manha" value="manha">
          <label for="manha">Manhã</label><br>
          <input type="radio" name="turno" id="tarde" value="tarde">
          <label for="tarde">Tarde</label>
        </td>

        <td>
          <strong>Atividades Extracurriculares</strong>
          <input type="checkbox" name="atividades" id="informatica" value="informatica">
          <label for="informatica">Informática</label><br>

          <input type="checkbox" name="atividades" id="musica" value="musica">
          <label for="musica">Música</label><br>

          <input type="checkbox" name="atividades" id="balet" value="balet">
          <label for="balet">Balet</label><br>

          <input type="checkbox" name="atividades" id="pintura" value="pintura">
          <label for="pintura">Pintura</label><br>

          <input type="checkbox" name="atividades" id="judo" value="judo">
          <label for="judo">Judô</label><br>

          <input type="checkbox" name="atividades" id="futebol" value="futebol">
          <label for="futebol">Futebol</label>
        </td>
      </tr>
    </table>
  </fieldset>

  <fieldset>
    <legend><strong>Endereço</strong></legend>

    <div class="campo-grupo">
      <div class="campo">
        <label for="logradouro">Logradouro</label>
        <input type="text" id="logradouro" name="logradouro" readonly>
      </div>
      <div class="campo">
        <label for="numero">número</label>
        <input type="number" id="numero" name="numero" placeholder="Ex: 123">
      </div>
    </div>

    <div class="campo-grupo">
      <div class="campo">
        <label for="complemento">complemento</label>
        <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco...">
      </div>
      <div class="campo">
        <label for="bairro">bairro</label>
        <input type="text" id="bairro" name="bairro">
      </div>
    </div>

    <div class="campo-grupo-3">
      <div class="campo">
        <label for="cidade">cidade</label>
        <input type="text" id="cidade" name="cidade">
      </div>
      <div class="campo">
        <label for="estado">estado</label>
        <input type="text" id="estado" name="estado">
      </div>
      <div class="campo">
        <label for="codigo">código ibge</label>
        <input type="text" id="codigo" name="codigo">
      </div>
    </div>

  </fieldset>

  <div class="botoes">
    <input type="submit" value="Enviar Formulário">
    <input type="reset" value="Limpar Campos">
  </div>

</form>

</body>

<script>
    const campoCep = document.getElementById('cep');

    campoCep.addEventListener('blur', async function() {
      try {
        const resposta = await fetch(`https://viacep.com.br/ws/${this.value}/json/`);
        const dados = await resposta.json()

        if (dados.erro) {
          alert('Digite um cep válido');
        }

        document.getElementById('logradouro').value = dados.estado;
        document.getElementById('complemento').value = dados.localidade;
        document.getElementById('bairro').value = dados.bairro;
        document.getElementById('cidade').value = dados.localidade;
        document.getElementById('estado').value = dados.estado;
        document.getElementById('codigo').value = dados.ibge;
      } catch(erro) {
        console.error("Erro ao buscar cidades:", error  );
      }


    });

    campoCep.addEventListener('input', function () {
        let valor = this.value.replace(/\D/g, ``);

        if (valor.length === 8) {
            valor = valor.slice(0, 5) + '-' + valor.slice(5, 8);
        }
        this.value = valor;
    });

    const campoCpf = document.getElementById('cpf');

    campoCpf.addEventListener('input', function () {
        let valor = this.value.replace(/\D/g, ``);

        if (valor.length === 11) {
            valor = valor.slice(0, 3) + '.' + valor.slice(3, 6) + '.' + valor.slice(6,9) + '-' + valor.slice(9);
        }
        this.value = valor;
    });

    const campoNasc = document.getElementById('nascimento');
    const campoIdade = document.getElementById('idade');

    campoNasc.addEventListener('change', function() {
        if (!this.value) {
          campoIdade.value = '';
          return;
        }

        const nascimento  = new Date(this.value);
        const hoje = new Date();

        let idade = hoje.getFullYear() - nascimento.getFullYear();
        const mesAtual = hoje.getMonth();
        const mesNasc = nascimento.getMonth();

        if (
              mesAtual < mesNasc ||
              (mesAtual === mesNasc && hoje.getDate() < nascimento.getDate())
        ) {
          idade --;
        }

        campoIdade.value = idade >= 0 ? idade + ' anos' : '';
    })

    const urlEstados = 'https://servicodados.ibge.gov.br/api/v1/localidades/estados';
    const estadosHTML = document.getElementById("estado1");
    const cidadesHTML = document.getElementById("cidade1");

    window.addEventListener('load', async function(){
      try {
        const request = await fetch(urlEstados);
        const response = await request.json();

        estadosHTML.innerHTML = '<option value="" disabled selected>Selecione um estado</option>';

        response.forEach(function(estado){
          estadosHTML.innerHTML += '<option value="'+estado.sigla+'">'+estado.nome+'</option>';
        });

      } catch (error) {
        console.error("Erro ao buscar estados:", error);
      }
    });

    estadosHTML.addEventListener('change', async function(){
      try {
        const urlCidades = 'https://servicodados.ibge.gov.br/api/v1/localidades/estados/'+estadosHTML.value+'/municipios';
        const request = await fetch(urlCidades);
        const response = await request.json();

        cidadesHTML.innerHTML = '<option value="" disabled selected>Selecione uma cidade</option>';

        response.forEach(function(cidade){
          cidadesHTML.innerHTML += '<option value="'+cidade.nome+'">'+cidade.nome+'</option>';
        });

      } catch (error) {
        console.error("Erro ao buscar cidades:", error);
      }
    });
</script>
</html>
