<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
  <body>
    <head>
      <h1>Escola Virtual</h1>
      <h2>Formulário de Pré-Matricula</h2>
    </head>

    <main>
      <table border="1">
        <tbody>
          <tr>
            <td>
              <h2>Dados Pessoais:</h2>
              <form>
                <labe>Nome do Aluno:</labe>
                <input type="text">
                <br>
                <br>
                <labe>Nascimento (dd/mm/aaaa):</labe>
                <input type="date">
                <br>
                <br>
                <labe>Nome da Mãe:</labe>
                <input type="text">
                <br>
                <br>
                <labe>Nome do Pai:</labe>
                <input type="text">
                <br>
                <br>
                <labe>Telefone:</labe>
                <input type="phone">
                <br>
                <br>
                <labe>Email:</labe>
                <input type="mail">
                <br>
                <br>
              </form>
            </td>
          </tr>

          <tr>
            <td>
              <h2>Informações de Matricula:</h2>
              <form>
                <label for="">Série</label>
                <br>
                <br>
                <select name="Série" id="">
                  <option>pré-escola</option>
                  <option>ensino médio</option>
                </select>

                <br>
                <br>

                <label for="">Turno: </label>
                <br>
                <input type="radio">
                <label for="">Manhã</label>
                <br>
                <input type="radio">
                <label for="">Tarde</label>

                <br>
                <label for="">Atividades Extracurriculares:</label>
                <br>
                <input type="checkbox">
                <label for="">Informática</label>
                <br>
                <input type="checkbox">
                <label for="">Música</label>
                <br>
                <input type="checkbox">
                <label for="">Ballet</label>
                <br>
                <input type="checkbox">
                <label for="">Pintura</label>
                <br>
                <input type="checkbox">
                <label for="">Judô</label>
                <br>
                <input type="checkbox">
                <label for="">Futebol</label>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
      <input type="submit">
      <input type="reset">
    </main>
  </body>
</html>
